name: CI — Migration content guard

# The SQL blur floor (≥300 m, M-MAPA-1) is the security boundary for the
# casa_motero feature and has no pgTAP infra in this repo. This guard greps
# the migration file directly so CI fails if the floor or its haversine check
# is ever removed from 026_casa_motero.sql.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration 026 must enforce the ≥300 m blur floor (haversine)
        run: grep -q 'haversine_distance' supabase/migrations/026_casa_motero.sql

      - name: Migration 026 must keep the server-side < 300 rejection
        run: grep -q '< 300' supabase/migrations/026_casa_motero.sql

      - name: Migration 031 must close direct mutations (RPC-only flow)
        run: |
          grep -q 'DROP POLICY IF EXISTS "mr_insert_guest"' supabase/migrations/031_secure_motoposada_flow.sql
          grep -q 'DROP POLICY IF EXISTS "mr_update_host"' supabase/migrations/031_secure_motoposada_flow.sql
          grep -q 'DROP POLICY IF EXISTS "mrev_insert_participant"' supabase/migrations/031_secure_motoposada_flow.sql

      - name: Migration 031 direct table writes must return 403
        run: |
          grep -q 'REVOKE INSERT, UPDATE, DELETE ON public.motoposada_requests FROM anon, authenticated' supabase/migrations/031_secure_motoposada_flow.sql
          grep -q 'REVOKE INSERT, UPDATE, DELETE ON public.motoposada_reviews FROM anon, authenticated' supabase/migrations/031_secure_motoposada_flow.sql

      - name: Migration 031 must ship all 5 authenticated RPCs
        run: |
          for rpc in request_motoposada respond_motoposada_request complete_motoposada_request cancel_motoposada_request submit_motoposada_review; do
            grep -q "CREATE OR REPLACE FUNCTION public.$rpc(" supabase/migrations/031_secure_motoposada_flow.sql
            grep -q "REVOKE EXECUTE ON FUNCTION public.$rpc" supabase/migrations/031_secure_motoposada_flow.sql
            grep -q "GRANT EXECUTE ON FUNCTION public.$rpc" supabase/migrations/031_secure_motoposada_flow.sql
          done

      - name: Migration 031 must target the production club schema
        run: |
          grep -q 'club_members' supabase/migrations/031_secure_motoposada_flow.sql
          ! grep -q 'clan_members' supabase/migrations/031_secure_motoposada_flow.sql

      - name: Migration 031 must keep trust_score clamped 0-100 server-side
        run: grep -q 'GREATEST(0, LEAST(100, COALESCE(trust_score, 50)' supabase/migrations/031_secure_motoposada_flow.sql

      - name: Migration 032 must repair and secure leaderboard refresh
        run: |
          grep -q 'v.verified_at >= v_cutoff' supabase/migrations/032_fix_leaderboard_snapshot_refresh.sql
          ! grep -q 'v.created_at' supabase/migrations/032_fix_leaderboard_snapshot_refresh.sql
          grep -q "period IN ('monthly', 'yearly', 'historical')" supabase/migrations/032_fix_leaderboard_snapshot_refresh.sql
          grep -q 'FROM anon, authenticated' supabase/migrations/032_fix_leaderboard_snapshot_refresh.sql
