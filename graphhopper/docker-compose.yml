# GraphHopper — Local development
# ============================================================
# Usage: docker compose up -d
# Test: curl http://localhost:8989/route?point=4.71,-74.07&point=6.25,-75.57&profile=motorcycle
# ============================================================

services:
  graphhopper:
    build: .
    ports:
      - "8989:8989"
    volumes:
      - gh-data:/data
    environment:
      - OSM_URL=https://download.geofabrik.de/south-america/colombia-latest.osm.pbf
      - JAVA_OPTS=-Xms1g -Xmx4g -XX:+UseParallelGC
    restart: unless-stopped

volumes:
  gh-data:
