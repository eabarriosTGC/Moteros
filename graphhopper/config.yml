# GraphHopper Configuration — AsfaltoClub v11
# ============================================================
# Compatible with GraphHopper 11.x
# datareader.file and graph.location are set here (not via -D flags
# because Dropwizard does not always pick up nested -D properties)
# ============================================================

graphhopper:
  datareader.file: /data/colombia-latest.osm.pbf
  graph.location: /data/graph-cache

  profiles:
    # ── Motorcycle profile ──
    # Avoids motorways, prefers winding secondary/tertiary roads
    - name: motorcycle
      custom_model:
        speed:
          - if: "road_class == MOTORWAY || road_class == MOTORWAY_LINK"
            limit_to: "80"
          - if: "road_class == TRUNK || road_class == TRUNK_LINK"
            limit_to: "90"
          - if: "road_class == PRIMARY || road_class == PRIMARY_LINK"
            limit_to: "80"
          - if: "road_class == SECONDARY || road_class == SECONDARY_LINK"
            limit_to: "70"
          - if: "road_class == TERTIARY || road_class == TERTIARY_LINK"
            limit_to: "60"
          - if: "road_class == UNCLASSIFIED"
            limit_to: "40"
          - if: "road_class == RESIDENTIAL"
            limit_to: "30"
          - if: "road_class == LIVING_STREET || road_class == SERVICE"
            limit_to: "15"
          - if: "road_class == TRACK"
            limit_to: "10"
          - if: "surface == UNPAVED || surface == GRAVEL || surface == DIRT || surface == SAND"
            limit_to: "20"
          - else: ""
            limit_to: "50"
        priority:
          - if: "road_class == SECONDARY || road_class == TERTIARY"
            multiply_by: "1.3"
          - if: "road_class == UNCLASSIFIED"
            multiply_by: "1.1"
          - if: "road_class == PRIMARY"
            multiply_by: "0.7"
          - if: "road_class == TRUNK"
            multiply_by: "0.4"
          - if: "road_class == MOTORWAY || road_class == MOTORWAY_LINK"
            multiply_by: "0.1"
          - if: "surface == UNPAVED || surface == GRAVEL || surface == DIRT || surface == SAND"
            multiply_by: "0.3"
          - if: "scenic == yes || tourism == viewpoint"
            multiply_by: "1.2"

    # ── Car profile (fallback) ──
    - name: car
      custom_model:
        speed:
          - if: "road_class == MOTORWAY || road_class == MOTORWAY_LINK"
            limit_to: "110"
          - if: "road_class == TRUNK || road_class == TRUNK_LINK"
            limit_to: "100"
          - if: "road_class == PRIMARY || road_class == PRIMARY_LINK"
            limit_to: "90"
          - if: "road_class == SECONDARY || road_class == SECONDARY_LINK"
            limit_to: "80"
          - if: "road_class == TERTIARY || road_class == TERTIARY_LINK"
            limit_to: "70"
          - if: "road_class == UNCLASSIFIED"
            limit_to: "50"
          - if: "road_class == RESIDENTIAL"
            limit_to: "30"
          - else: ""
            limit_to: "50"

  # Contraction Hierarchies for fast routing (only car, saves RAM)
  profiles_ch:
    - profile: car
      preparations: "fast"

  server:
    applicationConnectors:
      - type: http
        port: 8989
        bindHost: 0.0.0.0
    adminConnectors:
      - type: http
        port: 8990
        bindHost: 0.0.0.0
